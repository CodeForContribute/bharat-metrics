version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "📦 Installing project dependencies..."
      - npm ci

  build:
    commands:
      - echo "🏗️ Building the React application for production..."
      - npm run build
      - echo "✅ Build complete!"

  post_build:
    commands:
      - echo "Deploying to new S3 bucket: bharatmetrics.net..."
      - aws s3 sync ./build/ s3://bharatmetrics.net --delete

artifacts:
  files:
    - '**/*'
  base-directory: build
  discard-paths: no